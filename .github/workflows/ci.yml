name: ci

# The per-push gate: same checks as the local ritual (gofmt, build,
# vet, full test run). Tests spin real Postgres through testcontainers,
# which the runner provides out of the box.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

  web:
    # The client gate: typecheck + build + lint. routeTree.gen.ts is
    # committed, so tsc runs before the router plugin regenerates it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

  smoke:
    # Full-stack smoke: build the image from this push, boot the compose
    # stack, and walk the whole MVP journey against it (scripts/smoke.sh).
    # Building the compose image tag locally keeps compose from pulling
    # GHCR — the code under test is what gets smoked.
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ghcr.io/cuihairu/coterie:nightly .

      - name: Boot the stack
        run: docker compose -f deployments/docker-compose.yml up -d --wait

      - name: Wait for the API
        run: |
          code=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/healthz || true)
            [ "$code" = 200 ] && break
            sleep 2
          done
          if [ "$code" != 200 ]; then
            docker compose -f deployments/docker-compose.yml logs
            exit 1
          fi

      - name: Smoke the MVP journey
        run: scripts/smoke.sh

      - name: Stack logs
        if: failure()
        run: docker compose -f deployments/docker-compose.yml logs
