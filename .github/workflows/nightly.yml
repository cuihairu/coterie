name: nightly

# Daily build: test, cross-compile the server binary, and publish a
# prerelease tagged nightly-YYYYMMDD. Runs off the hour to avoid the
# GitHub Actions scheduled-job rush.
on:
  schedule:
    - cron: "41 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Test
        run: go test ./...

      - name: Set version
        run: echo "VERSION=nightly-$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      # Image publish comes after the test run so a red build never
      # ships. The rolling "nightly" tag is what deployments reference;
      # the versioned tag pins a day (docs/design.md §11.2).
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:nightly
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}

      - name: Build binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            output="dist/coterie-${GOOS}-${GOARCH}"
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath -ldflags "-s -w" -o "$output" ./apps/server
            tar -czf "dist/coterie-${VERSION}-${GOOS}-${GOARCH}.tar.gz" -C dist "coterie-${GOOS}-${GOARCH}"
            rm "$output"
          done

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body: |
            Automated nightly build from `main`.
            Not for production use.
          prerelease: true
          fail_on_unmatched_files: true
          files: dist/*.tar.gz
